name: Run AD tests and build website

on:
  push:
    branches:
      - main
    # If _any_ of the modified files match this filter, it will trigger this
    # workflow
    paths:
      - '**/*.jl'
      - '*.toml'
      - 'ad.py'
      - '.github/workflows/generate_website.yml'
  pull_request:
    paths:
      - '**/*.jl'
      - '*.toml'
      - 'ad.py'
      - '.github/workflows/generate_website.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: write

# Cancel existing tests on the same PR if a new commit is added to a pull request
concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  setup-keys:
    runs-on: ubuntu-latest
    
    outputs:
      # Forward step outputs to job outputs
      model_keys: ${{ steps.keys.outputs.model_keys }}
      adtype_keys: ${{ steps.keys.outputs.adtype_keys }}
      manifest: ${{ steps.keys.outputs.manifest }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1

      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # 3.0.2
        with:
          version: "pre"

      - uses: julia-actions/cache@a7bed9df697e5d7309d68afe7542a87621a8b6c8 # 3.3.0
        with:
          cache-name: "ad"

      - uses: julia-actions/julia-buildpkg@e3eb439fad4f9aba7da2667e7510e4a46ebc46e1 # 1.7.0

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # 10.0.1
        with:
          python-version: "3.13"

      - name: Setup keys
        id: keys
        run: uv run ad.py setup
        env:
          DATADEPS_ALWAYS_ACCEPT: "true"

  run-models:
    runs-on: ubuntu-latest
    needs: setup-keys
    strategy:
      matrix:
        model: ${{ fromJSON(needs.setup-keys.outputs.model_keys) }}

    outputs:
      json: ${{ steps.output-matrix.outputs.json }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1

      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # 3.0.2
        with:
          version: "pre"

      - uses: julia-actions/cache@a7bed9df697e5d7309d68afe7542a87621a8b6c8 # 3.3.0
        with:
          cache-name: "ad"
          include-matrix: false

      - uses: julia-actions/julia-buildpkg@e3eb439fad4f9aba7da2667e7510e4a46ebc46e1 # 1.7.0

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # 10.0.1
        with:
          python-version: "3.13"

      - name: Run given model with all adtypes
        id: run
        run: uv run ad.py run --model ${{ matrix.model }}
        env:
          ADTYPE_KEYS: ${{ needs.setup-keys.outputs.adtype_keys }}
          ADTESTS_MODELS_TO_LOAD: ${{ matrix.model }}
          DATADEPS_ALWAYS_ACCEPT: "true"
          PYTHONUNBUFFERED: "1"

      - name: Output matrix values
        id: output-matrix
        uses: beacon-biosignals/matrix-output@e7e337124face37359a51aa7dd8674c512936eef # 1.0.4
        with:
          yaml: |
            model_name: ${{ matrix.model }}
            results: ${{ steps.run.outputs.results }}

  collect-results:
    runs-on: ubuntu-latest
    needs: [setup-keys, run-models]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # 10.0.1
        with:
          python-version: "3.13"

      - run: uv run ad.py html
        env:
          RESULTS_JSON: ${{ needs.run-models.outputs.json }}
          MANIFEST: ${{ needs.setup-keys.outputs.manifest }}

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # 6.0.10
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install
        working-directory: web

      - name: Build website
        run: pnpm build --base ${{ github.event_name == 'pull_request' && '/ADTests/pr' || '/ADTests' }}
        working-directory: web

      - name: Upload results
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # 4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web/dist
          destination_dir: ${{ github.event_name == 'pull_request' && 'pr' || '' }}
          keep_files: true
